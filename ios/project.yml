# XcodeGen spec. There is no .xcodeproj checked in, because a generated
# one is a large binary-ish file that conflicts on every merge and cannot
# be reviewed. `xcodegen generate` in this directory produces it.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open JavadLogger.xcodeproj
name: JavadLogger

options:
  bundleIdPrefix: com.example.javadlogger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GreisKit:
    path: GreisKit

targets:
  JavadLogger:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GreisKit
        product: GreisKit
    # XcodeGen *generates* this file, so everything the app needs has to be
    # here. A hand-written Info.plist at the same path is silently
    # overwritten — which is how the first build shipped without the local
    # network permission and could not have reached a receiver at all.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Javad Logger
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "5"

        # With GENERATE_INFOPLIST_FILE off, Xcode does not add this for
        # us, and without it iOS ignores the compiled asset catalog and
        # shows the app with a blank icon.
        CFBundleIconName: AppIcon

        # The prompt iOS puts up on the first socket to a device on the
        # same Wi-Fi. Without this key the app is denied local network
        # access outright, with no prompt and no error worth reading.
        NSLocalNetworkUsageDescription: >-
          Javad Logger connects to your Javad receiver over the Wi-Fi network the
          receiver itself provides. Without this it cannot reach the receiver at all.

        # Files land in the app's own container. These two are the whole of
        # "where the CSV goes" on iOS: they put the container in the Files
        # app under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        # Without a launch screen iOS runs the app letterboxed at a legacy
        # screen size, which looks like a bug and hides half the readings.
        UILaunchScreen: {}

        # Portrait only. The screen is a column of readings, and a rotation
        # mid-session is a change of layout nobody asked for while watching
        # a number.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.javadlogger
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The runner builds against the iOS 26 SDK, so the real glass API is
        # available. See App/Glass.swift — still the only file that knows
        # about it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: USE_LIQUID_GLASS

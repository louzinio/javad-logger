[pytest]
# The imports in this repository are top-level packages with no src/ prefix
# - "from greis.parser import GreisParser" - so the repository root has to be
# on sys.path for the tests to import the code they are testing. Adding it
# here rather than in a conftest.py means it holds however pytest is invoked:
# from the root, from inside tests/, or with a single file named on the
# command line.
pythonpath = .
testpaths = tests
